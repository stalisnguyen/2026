<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Happy New Year ✨</title>

  <style>
    :root{
      --bg1:#050a16;
      --bg2:#0a1b2a;
      --text:#ecf2ff;
      --muted: rgba(236,242,255,.72);

      --glassA: rgba(255,255,255,.12);
      --glassB: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.18);
      --shadow: 0 30px 90px rgba(0,0,0,.42);

      --radius: 28px;
      --ease: cubic-bezier(.16,1,.3,1);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      overflow:hidden;
      background:
        radial-gradient(1200px 800px at 20% 15%, rgba(120,160,255,.18), transparent 55%),
        radial-gradient(900px 700px at 85% 20%, rgba(255,120,190,.14), transparent 55%),
        radial-gradient(900px 900px at 55% 80%, rgba(140,255,210,.10), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .aurora{
      position:fixed; inset:-20%;
      background:
        radial-gradient(circle at 30% 30%, rgba(90,180,255,.22), transparent 55%),
        radial-gradient(circle at 70% 40%, rgba(255,120,210,.20), transparent 58%),
        radial-gradient(circle at 55% 75%, rgba(120,255,210,.16), transparent 60%);
      filter: blur(28px);
      animation: drift 14s var(--ease) infinite alternate;
      pointer-events:none;
    }

    @keyframes drift{
      from{ transform: translate(-2%, -1%) scale(1.02); }
      to{ transform: translate(2%, 1.5%) scale(1.06); }
    }

    canvas{
      position:fixed;
      inset:0;
      pointer-events:none;
    }

    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }

    .card{
      width:min(720px, 92vw);
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--glassA), var(--glassB));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      padding: 28px 22px 26px;
      text-align:center;
    }

    h1{
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 56px);
      letter-spacing: -0.02em;
    }

    .love{
      margin: 0 0 14px;
      font-size: clamp(18px, 3.4vw, 28px);
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.22);
      background:
        linear-gradient(135deg, rgba(255,120,210,.28), rgba(120,200,255,.18));
      box-shadow: 0 20px 60px rgba(255,120,210,.25);
      backdrop-filter: blur(12px);
    }

    .hint{
      font-size: 13px;
      opacity:.75;
      margin-bottom:18px;
    }

    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }

    button{
      border-radius: 16px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.10);
      color: var(--text);
      font-weight: 600;
      font-size:14px;
      cursor:pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0,0,0,.22);
    }

    .float-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
    }

    .float{
      position:absolute;
      left: var(--x);
      top: 110%;
      opacity:0;
      font-weight:600;
      animation: rise var(--dur) var(--ease) infinite;
    }

    @keyframes rise{
      0%{opacity:0; transform:translate(-50%,0)}
      10%{opacity:.9}
      100%{opacity:0; transform:translate(-50%,-140vh)}
    }
  </style>
</head>

<body>
  <div class="aurora"></div>
  <canvas id="fx"></canvas>
  <div class="float-layer" id="floatLayer"></div>

  <main class="wrap">
    <section class="card">
      <h1>Happy New Year</h1>
      <p class="love">I LOVE YOU BABY!</p>
      <p class="hint">Tap “Fireworks” to burst, or just enjoy the auto-show.</p>

      <div class="row">
        <button onclick="burst()">🎆 Fireworks</button>
        <button onclick="spawnFloat()">💫 More floating text</button>
        <button onclick="toggleMode()">☀️ Party mode</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');
    let W,H,party=true;
    const sparks=[];

    function resize(){
      W=canvas.width=innerWidth;
      H=canvas.height=innerHeight;
    }
    addEventListener('resize',resize); resize();

    function burst(x=W/2,y=H/3){
      for(let i=0;i<90;i++){
        const a=Math.random()*Math.PI*2;
        sparks.push({
          x,y,
          vx:Math.cos(a)*Math.random()*6,
          vy:Math.sin(a)*Math.random()*6,
          life:60
        });
      }
    }

    function loop(){
      ctx.fillStyle='rgba(0,0,0,.15)';
      ctx.fillRect(0,0,W,H);
      sparks.forEach((p,i)=>{
        p.life--;
        p.x+=p.vx;
        p.y+=p.vy+=0.05;
        ctx.fillStyle=`rgba(255,200,255,${p.life/60})`;
        ctx.fillRect(p.x,p.y,2,2);
        if(p.life<=0) sparks.splice(i,1);
      });
      if(party && Math.random()<0.03) burst(Math.random()*W,Math.random()*H/2);
      requestAnimationFrame(loop);
    }
    loop();

    const floatLayer=document.getElementById('floatLayer');
    function spawnFloat(){
      const d=document.createElement('div');
      d.className='float';
      d.style.setProperty('--x',Math.random()*90+'vw');
      d.style.setProperty('--dur',(8+Math.random()*5)+'s');
      d.innerText=['Forever & always ♾️','Happy New Year ✨','Cheers to 2026 🥂','I LOVE YOU BABY!'][Math.floor(Math.random()*4)];
      floatLayer.appendChild(d);
      setTimeout(()=>d.remove(),13000);
    }
    setInterval(spawnFloat,1200);

    function toggleMode(){
      party=!party;
    }

    addEventListener('pointerdown',e=>burst(e.clientX,e.clientY));
  </script>
</body>
</html>
